version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: mi_base_de_datos
      MYSQL_ROOT_PASSWORD: tu_password_seguro
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  api:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:tu_password_seguro@db:3306/mi_base_de_datos
    depends_on:
      - db

volumes:
  db_data: